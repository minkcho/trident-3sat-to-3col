name = "atlas-trident-with-proof"
defaultTargets = ["atlas"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

[[lean_lib]]
name = "atlas"
globs = ["atlas.+"]

[[lean_exe]]
name = "atlas-tests"
root = "atlas.Tests"

[[lean_exe]]
name = "atlas-demo"
root = "atlas.Demo"

[[lean_exe]]
name = "atlas-sweep"
root = "atlas.Sweep"
